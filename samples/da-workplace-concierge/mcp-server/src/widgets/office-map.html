<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office map</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #616161;
    --card: #f5f5f5;
    --border: #e0e0e0;
    --available: #6bb700;
    --available-hover: #5a9c00;
    --booked: #c4c4c4;
    --mine: #0f6cbd;
    --room: #e8d5f2;
    --room-border: #9c6ade;
    --error: #c50f1f;
  }
  [data-theme="dark"] {
    --bg: #1f1f1f;
    --fg: #f0f0f0;
    --muted: #a0a0a0;
    --card: #2b2b2b;
    --border: #3d3d3d;
    --booked: #4a4a4a;
    --room: #3a2b4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
  }
  .header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .header h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .header .sub { color: var(--muted); font-size: 12px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 6px 0 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  svg { width: 100%; height: auto; display: block; }
  .desk { cursor: default; }
  .desk.available { cursor: pointer; }
  .desk.available:hover rect { fill: var(--available-hover); }
  .desk text { font-size: 9px; fill: #ffffff; pointer-events: none; font-family: inherit; }
  .room-label { font-size: 9px; fill: var(--fg); pointer-events: none; font-family: inherit; }
  .panel {
    margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card);
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
  }
  .panel.error { border-color: var(--error); }
  .panel .msg { flex: 1; min-width: 180px; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); cursor: pointer;
  }
  button.primary { background: var(--mine); border-color: var(--mine); color: #ffffff; }
  button:disabled { opacity: 0.6; cursor: wait; }
  .toolbar { display: flex; gap: 8px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div id="root">
  <div class="header">
    <div>
      <h2 id="title">Office map</h2>
      <div class="sub" id="subtitle">Waiting for data&hellip;</div>
    </div>
    <div class="toolbar">
      <button id="fullscreen-btn" class="hidden" type="button">Full screen</button>
    </div>
  </div>
  <div class="legend">
    <span><span class="swatch" style="background:var(--available)"></span>Available</span>
    <span><span class="swatch" style="background:var(--booked)"></span>Booked</span>
    <span><span class="swatch" style="background:var(--mine)"></span>Your desk</span>
    <span><span class="swatch" style="background:var(--room);border:1px solid var(--room-border)"></span>Meeting room</span>
  </div>
  <div id="map"></div>
  <div id="panel" class="panel hidden"></div>
</div>
<script>
(function () {
  "use strict";

  // window.openai is injected by the host. It may be undefined when the script
  // first runs (some hosts inject it later and announce it via the
  // openai:set_globals event), and individual APIs may be missing on some
  // hosts — so capabilities are re-evaluated at every use, never cached.
  var oai = window.openai;
  function canCallTool() { return !!(oai && typeof oai.callTool === "function"); }
  function canFollowUp() { return !!(oai && typeof oai.sendFollowUpMessage === "function"); }
  function canFullscreen() { return !!(oai && typeof oai.requestDisplayMode === "function"); }

  function esc(value) {
    return String(value).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  var CELL = 56, GAP = 10, PAD = 8;
  var current = null;
  var busy = false;

  function applyTheme() {
    var theme = oai && oai.theme === "dark" ? "dark" : "light";
    document.body.dataset.theme = theme;
  }

  function el(id) { return document.getElementById(id); }

  function svgEl(name, attrs) {
    var node = document.createElementNS("http://www.w3.org/2000/svg", name);
    for (var key in attrs) { node.setAttribute(key, attrs[key]); }
    return node;
  }

  function cssVar(name) {
    return getComputedStyle(document.body).getPropertyValue(name).trim();
  }

  function showPanel(html, isError) {
    var panel = el("panel");
    panel.innerHTML = html;
    panel.classList.toggle("error", !!isError);
    panel.classList.remove("hidden");
    notifyHeight();
  }

  function hidePanel() {
    el("panel").classList.add("hidden");
    notifyHeight();
  }

  function deskFill(desk) {
    if (desk.status === "available") { return cssVar("--available"); }
    if (current && desk.bookedByUserId === current.currentUserId) { return cssVar("--mine"); }
    return cssVar("--booked");
  }

  function render(data) {
    if (!data || !Array.isArray(data.desks)) { return; }
    current = data;
    el("title").textContent = (data.floorName || "Office") + " seat map";
    el("subtitle").textContent = data.date + " · " + data.summary.available +
      " of " + data.desks.length + " desks available";

    var cols = 6, deskRows = 4, roomRows = 1;
    var width = PAD * 2 + cols * CELL + (cols - 1) * GAP;
    var height = PAD * 2 + (deskRows + roomRows) * CELL + (deskRows + roomRows - 1) * GAP + 14;

    var svg = svgEl("svg", { viewBox: "0 0 " + width + " " + height, role: "img" });
    svg.setAttribute("aria-label", "Seat map for " + (data.floorName || "office floor"));

    data.desks.forEach(function (desk) {
      var x = PAD + desk.x * (CELL + GAP);
      var y = PAD + desk.y * (CELL + GAP);
      var group = svgEl("g", { "class": "desk " + desk.status });
      var rect = svgEl("rect", {
        x: x, y: y, width: CELL, height: CELL, rx: 8, fill: deskFill(desk)
      });
      group.appendChild(rect);
      var label = svgEl("text", { x: x + CELL / 2, y: y + CELL / 2 - 2, "text-anchor": "middle" });
      label.textContent = desk.label;
      group.appendChild(label);
      var status = svgEl("text", { x: x + CELL / 2, y: y + CELL / 2 + 12, "text-anchor": "middle" });
      status.textContent = desk.status === "available" ? "free" : (desk.bookedBy || "booked").split(" ")[0];
      group.appendChild(status);
      var tooltip = svgEl("title", {});
      tooltip.textContent = desk.status === "available"
        ? "Desk " + desk.label + " (" + desk.zone + ") — available, click to book"
        : "Desk " + desk.label + " (" + desk.zone + ") — booked by " + (desk.bookedBy || "someone");
      group.appendChild(tooltip);
      if (desk.status === "available" && canCallTool()) {
        group.addEventListener("click", function () { confirmBooking(desk); });
      }
      svg.appendChild(group);
    });

    (data.rooms || []).forEach(function (room) {
      var x = PAD + room.x * (CELL + GAP);
      var y = PAD + room.y * (CELL + GAP);
      var w = room.w * CELL + (room.w - 1) * GAP;
      var h = room.h * CELL + (room.h - 1) * GAP;
      var group = svgEl("g", {});
      group.appendChild(svgEl("rect", {
        x: x, y: y, width: w, height: h, rx: 8,
        fill: cssVar("--room"), stroke: cssVar("--room-border"), "stroke-width": 1.5
      }));
      var name = svgEl("text", { x: x + w / 2, y: y + h / 2 - 4, "text-anchor": "middle", "class": "room-label", "font-weight": "600" });
      name.textContent = room.name + " (" + room.capacity + "p)";
      group.appendChild(name);
      var info = svgEl("text", { x: x + w / 2, y: y + h / 2 + 10, "text-anchor": "middle", "class": "room-label" });
      info.textContent = room.bookings && room.bookings.length
        ? room.bookings.map(function (b) { return (b.start || "") + "–" + (b.end || ""); }).join(", ")
        : "no meetings";
      group.appendChild(info);
      svg.appendChild(group);
    });

    var map = el("map");
    map.innerHTML = "";
    map.appendChild(svg);
    notifyHeight();
  }

  function confirmBooking(desk) {
    if (busy) { return; }
    showPanel(
      '<span class="msg">Book desk <strong>' + esc(desk.label) + "</strong> (" + esc(desk.zone) +
      ") for <strong>" + esc(current.date) + "</strong>?</span>" +
      '<button type="button" id="cancel-btn">Not now</button>' +
      '<button type="button" class="primary" id="confirm-btn">Book desk</button>'
    );
    el("cancel-btn").addEventListener("click", hidePanel);
    el("confirm-btn").addEventListener("click", function () { bookDesk(desk); });
  }

  async function bookDesk(desk) {
    if (!canCallTool() || busy) { return; }
    busy = true;
    var btn = el("confirm-btn");
    if (btn) { btn.disabled = true; btn.textContent = "Booking…"; }
    try {
      var result = await oai.callTool("book_desk", { deskId: desk.id, date: current.date });
      var out = result && result.structuredContent;
      if (out && out.success) {
        render(out);
        showPanel('<span class="msg">✅ ' + esc(out.message) + "</span>");
        if (canFollowUp()) {
          oai.sendFollowUpMessage({
            prompt: "I just booked desk " + out.booking.deskLabel + " on floor " +
              out.booking.floor + " for " + out.booking.date +
              " using the office map. Please confirm my booking.",
          });
        }
      } else {
        if (out && Array.isArray(out.desks)) { render(out); }
        showPanel('<span class="msg">' + esc((out && out.message) || "Booking failed.") + "</span>", true);
      }
    } catch (err) {
      showPanel('<span class="msg">Something went wrong: ' + esc(err && err.message ? err.message : err) + "</span>", true);
    } finally {
      busy = false;
    }
  }

  function notifyHeight() {
    if (oai && typeof oai.notifyIntrinsicHeight === "function") {
      oai.notifyIntrinsicHeight(document.documentElement.scrollHeight);
    }
  }

  function syncFullscreenButton() {
    el("fullscreen-btn").classList.toggle("hidden", !canFullscreen());
  }

  el("fullscreen-btn").addEventListener("click", function () {
    if (canFullscreen()) { oai.requestDisplayMode({ mode: "fullscreen" }); }
  });

  // The host raises openai:set_globals when theme, displayMode, or toolOutput
  // change (including the initial tool payload on some hosts, which may also
  // be the first moment window.openai exists — hence the capability re-sync).
  window.addEventListener("openai:set_globals", function () {
    oai = window.openai;
    applyTheme();
    syncFullscreenButton();
    if (oai && oai.toolOutput) { render(oai.toolOutput); }
  });

  applyTheme();
  syncFullscreenButton();
  if (oai && oai.toolOutput) {
    render(oai.toolOutput);
  } else {
    el("subtitle").textContent = "Open this widget from Microsoft 365 Copilot to see live data.";
  }
})();
</script>
</body>
</html>
