<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Office occupancy</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #616161;
    --card: #f5f5f5;
    --border: #e0e0e0;
    --track: #e8e8e8;
    --floor1: #0f6cbd;
    --floor2: #6bb700;
  }
  [data-theme="dark"] {
    --bg: #1f1f1f;
    --fg: #f0f0f0;
    --muted: #a0a0a0;
    --card: #2b2b2b;
    --border: #3d3d3d;
    --track: #3a3a3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 12px;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--fg);
    font-size: 14px;
  }
  h2 { margin: 0 0 2px; font-size: 16px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .legend { display: flex; gap: 14px; margin-bottom: 10px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  li {
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  }
  li.clickable { cursor: pointer; }
  li.clickable:hover { border-color: var(--floor1); }
  .day-head { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .day-head .name { font-weight: 600; }
  .day-head .count { color: var(--muted); font-size: 12px; }
  .bars { display: flex; flex-direction: column; gap: 4px; }
  .track { background: var(--track); border-radius: 4px; height: 8px; overflow: hidden; }
  .fill { height: 100%; border-radius: 4px; }
  .fill.f1 { background: var(--floor1); }
  .fill.f2 { background: var(--floor2); }
  .hint { margin-top: 10px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<h2>Office occupancy</h2>
<div class="sub" id="subtitle">Waiting for data&hellip;</div>
<div class="legend">
  <span><span class="swatch" style="background:var(--floor1)"></span>Floor 1</span>
  <span><span class="swatch" style="background:var(--floor2)"></span>Floor 2</span>
</div>
<ul id="days"></ul>
<div class="hint" id="hint"></div>
<script>
(function () {
  "use strict";

  // window.openai is injected by the host. It may be undefined when the script
  // first runs (some hosts inject it later and announce it via the
  // openai:set_globals event), so capabilities are re-evaluated at every use.
  var oai = window.openai;
  function canFollowUp() { return !!(oai && typeof oai.sendFollowUpMessage === "function"); }

  function el(id) { return document.getElementById(id); }

  function applyTheme() {
    document.body.dataset.theme = oai && oai.theme === "dark" ? "dark" : "light";
  }

  function render(data) {
    if (!data || !Array.isArray(data.days)) { return; }
    el("subtitle").textContent = "Booked desks over the next " + data.days.length +
      " days, starting " + data.startDate;

    var list = el("days");
    list.innerHTML = "";
    data.days.forEach(function (day) {
      var item = document.createElement("li");

      var head = document.createElement("div");
      head.className = "day-head";
      var name = document.createElement("span");
      name.className = "name";
      name.textContent = day.dayName + " " + day.date;
      var count = document.createElement("span");
      count.className = "count";
      count.textContent = day.booked + " of " + day.capacity + " desks booked";
      head.appendChild(name);
      head.appendChild(count);
      item.appendChild(head);

      var bars = document.createElement("div");
      bars.className = "bars";
      day.byFloor.forEach(function (floor) {
        var track = document.createElement("div");
        track.className = "track";
        var fill = document.createElement("div");
        fill.className = "fill f" + floor.floor;
        var pct = floor.capacity ? Math.round((floor.booked / floor.capacity) * 100) : 0;
        fill.style.width = Math.min(100, pct) + "%";
        fill.title = "Floor " + floor.floor + ": " + floor.booked + " of " + floor.capacity;
        track.appendChild(fill);
        bars.appendChild(track);
      });
      item.appendChild(bars);

      // The simplest form of widget interactivity: no direct tool call, just
      // hand the conversation back to the agent with a follow-up message.
      if (canFollowUp()) {
        item.className = "clickable";
        item.addEventListener("click", function () {
          oai.sendFollowUpMessage({
            prompt: "Show me the office map for " + day.date + " so I can book a desk.",
          });
        });
      }
      list.appendChild(item);
    });

    el("hint").textContent = canFollowUp()
      ? "Select a day to open its office map."
      : "";
    notifyHeight();
  }

  function notifyHeight() {
    if (oai && typeof oai.notifyIntrinsicHeight === "function") {
      oai.notifyIntrinsicHeight(document.documentElement.scrollHeight);
    }
  }

  window.addEventListener("openai:set_globals", function () {
    oai = window.openai;
    applyTheme();
    if (oai && oai.toolOutput) { render(oai.toolOutput); }
  });

  applyTheme();
  if (oai && oai.toolOutput) {
    render(oai.toolOutput);
  } else {
    el("subtitle").textContent = "Open this widget from Microsoft 365 Copilot to see live data.";
  }
})();
</script>
</body>
</html>
